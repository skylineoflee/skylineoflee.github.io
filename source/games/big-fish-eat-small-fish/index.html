layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大鱼吃小鱼 - 古道青阳</title>
  <meta name="description" content="本地小游戏：控制大鱼吃掉小鱼，不断成长。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 返回首页 -->
  <a class="back-link" href="/">← 返回博客</a>

  <!-- 游戏容器 -->
  <div class="game-container">
    <canvas id="game-canvas" width="960" height="600"></canvas>

    <!-- HUD -->
    <div class="hud">
      <span><span class="label">得分</span> <span class="value" id="hud-score">0</span></span>
      <span><span class="label">体型</span> <span class="value" id="hud-size">18</span></span>
    </div>

    <!-- 开始/结束覆盖层 -->
    <div class="message-overlay" id="game-message-overlay">
      <div class="message-text" id="game-message">大鱼吃小鱼</div>
      <button class="btn" id="btn-start">开始游戏</button>
    </div>
  </div>

  <div class="controls-hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> 移动 ·
    <kbd>空格</kbd> 加速 · 鼠标 / 触摸 跟随移动
  </div>

  <!-- 游戏脚本（按依赖顺序加载） -->
  <script src="js/config.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/entities/player.js"></script>
  <script src="js/entities/fish.js"></script>
  <script src="js/engine/world.js"></script>
  <script src="js/engine/renderer.js"></script>
  <script src="js/engine/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
