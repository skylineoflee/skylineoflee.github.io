<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111"/>
      <stop offset="1" stop-color="#333"/>
    </linearGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25f4ee"/>
      <stop offset="1" stop-color="#25f4ee"/>
    </linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fe2c55"/>
      <stop offset="1" stop-color="#fe2c55"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="16" fill="url(#bg)"/>
  <!-- 音符 -->
  <g transform="translate(320,180)">
    <path d="M-95 -95 L15 -135 L15 -45 L-95 5 Z" fill="url(#d1)" opacity="0.95"/>
    <!-- 右侧音符 -->
    <g transform="translate(110,50)">
      <path d="M-95 -95 L15 -135 L15 -45 L-95 5 Z" fill="url(#d2)" opacity="0.95"/>
    </g>
    <!-- 圆点 -->
    <ellipse cx="-95" cy="25" rx="38" ry="30" fill="url(#d1)"/>
    <ellipse cx="15" cy="85" rx="38" ry="30" fill="url(#d2)"/>
  </g>
  <text x="320" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#fff">抖音</text>
</svg>
